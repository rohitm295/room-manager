<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Properties | RoomFlow</title>
  <link rel="stylesheet" href="floor-flow.css">
</head>

<body data-page="properties">
  <nav aria-label="Main navigation">
    <a href="dashboard.html">RoomFlow</a>
    <a href="properties.html" aria-current="page">Properties</a>
    <a href="rooms.html">Rooms</a>
    <a href="tenants.html">Tenants</a>
    <a href="rent.html">Rent</a>
    <a href="electricity.html">Electricity</a>
    <a href="payments.html">Payments</a>
    <a href="profile.html">My Profile</a>
  </nav>

  <main>
    <header>
      <h1>My Properties</h1>
      <div>
        <button id="refresh" type="button" disabled>Refresh</button>
        <button id="add" type="button" disabled>+ Add Property</button>
      </div>
    </header>

    <div id="notice" role="status" aria-live="polite">Loading…</div>
    <section id="list"></section>
  </main>

  <dialog id="dialog" aria-labelledby="formTitle">
    <p id="formNotice" role="status" aria-live="polite"></p>

    <form id="form">
      <h2 id="formTitle">Add Property</h2>

      <label for="name">Property name *</label>
      <input id="name" name="name" required maxlength="100"
             placeholder="e.g. Chhaya House">

      <label for="type">Property type</label>
      <select id="type" name="type" required>
        <option value="House">House</option>
        <option value="Flat">Flat / Apartment</option>
        <option value="PG">PG</option>
        <option value="Room">Room</option>
        <option value="Other">Other</option>
      </select>

      <label for="address">Full address *</label>
      <input id="address" name="address" required maxlength="500"
             placeholder="Building, area, city">

      <label for="floors">Floors — one per line *</label>
      <textarea id="floors" name="floors" required
        placeholder="Ground Floor&#10;First Floor&#10;Second Floor"></textarea>

      <small>
        Save the property, then open Manage rooms to add rooms
        and their rent under each floor.
      </small>

      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" maxlength="2000"></textarea>

      <p>
        <button id="save" type="submit" disabled>Save</button>
        <button id="cancel" type="button">Close</button>
      </p>
    </form>
  </dialog>

  <script type="module" src="floor-flow.js"></script>
</body>
</html>
