<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rooms | RoomFlow</title>
  <link rel="stylesheet" href="floor-flow.css">
</head>

<body data-page="rooms">
  <nav aria-label="Main navigation">
    <a href="dashboard.html">RoomFlow</a>
    <a href="properties.html">Properties</a>
    <a href="rooms.html" aria-current="page">Rooms</a>
    <a href="tenants.html">Tenants</a>
    <a href="rent.html">Rent</a>
    <a href="electricity.html">Electricity</a>
    <a href="payments.html">Payments</a>
    <a href="profile.html">My Profile</a>
  </nav>

  <main>
    <header>
      <h1>Rooms</h1>
      <div>
        <button id="refresh" type="button" disabled>Refresh</button>
        <button id="add" type="button" disabled>+ Add Room</button>
      </div>
    </header>

    <div id="notice" role="status" aria-live="polite">Loading…</div>
    <section id="list"></section>
  </main>

  <dialog id="dialog" aria-labelledby="formTitle">
    <p id="formNotice" role="status" aria-live="polite"></p>

    <form id="form">
      <h2 id="formTitle">Add Room</h2>

      <label for="name">Room name / number *</label>
      <input id="name" name="name" required maxlength="100"
             placeholder="e.g. Room 101">

      <label for="propertyId">Property *</label>
      <select id="propertyId" name="propertyId" required></select>

      <label for="floor">Floor *</label>
      <select id="floor" name="floor" required></select>

      <label for="type">Room type</label>
      <select id="type" name="type" required>
        <option value="Single">Single</option>
        <option value="Shared">Shared</option>
        <option value="Studio">Studio</option>
        <option value="Other">Other</option>
      </select>

      <label for="rent">Monthly rent ₹ *</label>
      <input id="rent" name="rent" type="number"
             required min="0" step="0.01">

      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="Available">Available</option>
        <option value="Maintenance">Maintenance</option>
        <option value="Inactive">Inactive</option>
        <option value="Occupied">Occupied</option>
      </select>

      <small>
        Assign the occupant from the Tenants page.
        Existing tenant rent stays separate from room rent.
      </small>

      <label for="size">Room size</label>
      <input id="size" name="size" maxlength="100"
             placeholder="e.g. 12 x 10 ft">

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" maxlength="2000"></textarea>

      <p>
        <button id="save" type="submit" disabled>Save</button>
        <button id="cancel" type="button">Close</button>
      </p>
    </form>
  </dialog>

  <script type="module" src="floor-flow.js"></script>
</body>
</html>
