<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tenants | RoomFlow</title>
  <link rel="stylesheet" href="floor-flow.css">
</head>

<body data-page="tenants">
  <nav aria-label="Main navigation">
    <a href="dashboard.html">RoomFlow</a>
    <a href="properties.html">Properties</a>
    <a href="rooms.html">Rooms</a>
    <a href="tenants.html" aria-current="page">Tenants</a>
    <a href="rent.html">Rent</a>
    <a href="electricity.html">Electricity</a>
    <a href="payments.html">Payments</a>
    <a href="profile.html">My Profile</a>
  </nav>

  <main>
    <header>
      <h1>Tenants</h1>
      <div>
        <button id="refresh" type="button" disabled>Refresh</button>
        <button id="add" type="button" disabled>+ Add Tenant</button>
      </div>
    </header>

    <div id="notice" role="status" aria-live="polite">Loading…</div>
    <section id="list"></section>
  </main>

  <dialog id="dialog" aria-labelledby="formTitle">
    <p id="formNotice" role="status" aria-live="polite"></p>

    <form id="form">
      <h2 id="formTitle">Add Tenant</h2>

      <label for="name">Full name *</label>
      <input id="name" name="name" required maxlength="100">

      <label for="propertyId">Property *</label>
      <select id="propertyId" name="propertyId" required></select>

      <label for="floor">Floor *</label>
      <select id="floor" name="floor" required></select>

      <label for="roomId">Available room *</label>
      <select id="roomId" name="roomId" required></select>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" maxlength="30">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="150">

      <label for="monthlyRent">Agreed monthly rent ₹ *</label>
      <input id="monthlyRent" name="monthlyRent"
             type="number" required min="0" step="0.01" value="0">

      <label for="securityDeposit">Security deposit ₹</label>
      <input id="securityDeposit" name="securityDeposit"
             type="number" min="0" step="0.01" value="0">

      <label for="moveInDate">Move-in date *</label>
      <input id="moveInDate" name="moveInDate" type="date" required>

      <label for="moveOutDate">Move-out date</label>
      <input id="moveOutDate" name="moveOutDate" type="date">

      <label for="status">Status</label>
      <select id="status" name="status" required>
        <option value="Active">Active</option>
        <option value="Inactive">Moved out / Inactive</option>
      </select>

      <small>
        To move out, select Inactive and enter the move-out date.
        For another room, close this stay and add a new tenant entry.
        Previous entries remain in history.
      </small>

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes" maxlength="2000"></textarea>

      <p>
        <button id="save" type="submit" disabled>Save</button>
        <button id="cancel" type="button">Close</button>
      </p>
    </form>
  </dialog>

  <script type="module" src="floor-flow.js"></script>
</body>
</html>
